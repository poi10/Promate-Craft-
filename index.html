<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptCraft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PromptCraft</h1>
            <p>حوّل أفكارك البسيطة إلى موجهات احترافية</p>
        </header>
        
        <main>
            <div class="input-section">
                <textarea id="userInput" placeholder="اكتب فكرتك هنا... (مثال: فتاة سقطت ومتعرقة)"></textarea>
                <button id="generateBtn">إنشاء الموجه</button>
            </div>
            
            <div class="output-section">
                <h2>الموجه الاحترافي المُنشأ:</h2>
                <div class="prompt-container">
                    <textarea id="outputPrompt" readonly placeholder="سيظهر الموجه النهائي هنا..."></textarea>
                    <button id="copyBtn">نسخ</button>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
