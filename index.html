
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجري</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 0; background: #f5f5f5; }
    header { background: #111; color: #fff; padding: 20px; text-align: center; }
    .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
    .product { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align: center; }
    .product img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; }
    .product h3 { margin: 10px 0 5px; }
    .product p { color: green; margin: 5px 0; }
    .buy-btn { background: #007bff; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>أهلاً في متجري</h1>
</header>

<div class="container">
  <div class="product">
    <img src="https://via.placeholder.com/200" alt="منتج">
    <h3>منتج رقم 1</h3>
    <p>99 ريال</p>
    <button class="buy-btn">أضف للسلة</button>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/200" alt="منتج">
    <h3>منتج رقم 2</h3>
    <p>120 ريال</p>
    <button class="buy-btn">أضف للسلة</button>
  </div>
</div>

</body>
</html>
